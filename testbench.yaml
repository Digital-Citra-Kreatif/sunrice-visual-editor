# The demo site for `composer serve`: the panel, the CMS and the editor,
# with the CMS's starter templates and demo content. Sign in at
# /_workbench/login/admin@example.com (or admin@example.com / password at /admin).
laravel: '@testbench'

providers:
  - Sunrice\Admin\AdminServiceProvider
  - Sunrice\Cms\CmsServiceProvider
  - Spatie\Honeypot\HoneypotServiceProvider
  - Sunrice\VisualEditor\VisualEditorServiceProvider
  - Workbench\App\Providers\AdminPanelProvider

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/admin/visual-editor'
  user: admin@example.com
  install: true
  auth: true
  health: false
  discovers:
    web: false
    api: false
    commands: false
    components: false
    factories: false
    views: false
  build:
    - create-sqlite-db
    - db-wipe
    - migrate-fresh:
        --seed: true
        --seeder: Workbench\Database\Seeders\DatabaseSeeder
    - sunrice:assets
    - vendor:publish:
        --tag: sunrice-cms-assets
        --force: true
    - vendor:publish:
        --tag: sunrice-cms-templates
        --force: true
    - vendor:publish:
        --tag: sunrice-visual-editor-assets
        --force: true
    - storage:link
  sync:
    - from: storage
      to: workbench/storage
      reverse: true

# One KEY=value per line, as in a .env file.
env:
  - 'AUTH_MODEL="Workbench\\App\\Models\\User"'
  - DB_CONNECTION=sqlite
  - SUNRICE_VISUAL_EDITOR=true
  # A build command that harms nothing, so the editor's Build button can be tried on the demo site.
  - 'SUNRICE_VISUAL_EDITOR_BUILD="php -v"'
