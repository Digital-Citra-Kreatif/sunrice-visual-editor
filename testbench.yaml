laravel: '@testbench'

providers:
  - Sunrice\Admin\AdminServiceProvider
  - Sunrice\Cms\CmsServiceProvider
  - Spatie\Honeypot\HoneypotServiceProvider
  - Sunrice\VisualEditor\VisualEditorServiceProvider
  - Workbench\App\Providers\AdminPanelProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: false
    commands: false
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - storage-link:
        --force: true
    - create-sqlite-db
    - db-wipe
    - migrate-fresh:
        --seed: true
        --seeder: Workbench\Database\Seeders\DatabaseSeeder
    - sunrice:assets
  assets:
    - sunrice-cms-assets
    - sunrice-cms-templates
    - sunrice-visual-editor-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true

# One KEY=value per line, as in a .env file.
env:
  - 'AUTH_MODEL="Workbench\\App\\Models\\User"'
  - DB_CONNECTION=sqlite
  # The panel's and the plugins' script addresses are made from it (composer serve's address, where CI's smoke test serves it too).
  - APP_URL=http://127.0.0.1:8000
  # The database cache store on the workbench's SQLite file by name (see sunrice's own testbench.yaml).
  - DB_CACHE_CONNECTION=sqlite
  - SUNRICE_VISUAL_EDITOR=true
  # The demo's users sign in with Sunrice-Demo-2026!, which the panel takes as strong; it isn't asked about known leaks.
  - SUNRICE_PASSWORD_UNCOMPROMISED=false
  # Agents may change templates with the editor's tools (the CMS's switch).
  - SUNRICE_AI_TEMPLATES=true
  # A build command that harms nothing, so the editor's Build button can be tried on the demo site.
  - 'SUNRICE_VISUAL_EDITOR_BUILD="php -v"'
