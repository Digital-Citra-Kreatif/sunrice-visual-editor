name: lock

# Scratch branch, not part of the package: resolves main's Composer
# dependencies on PHP 8.3 and commits the lock file here, for a development
# environment that can reach GitHub but not Packagist.

on:
  push:
    branches: [ci/lock]

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: main
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, sqlite3, pdo_sqlite, gd, intl
          coverage: none
      - name: Resolve
        working-directory: main
        run: composer update --no-install --no-interaction --no-ansi
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'
      - name: Commit
        run: |
          cp main/composer.lock composer.lock
          cp main/package-lock.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composer.lock package-lock.json
          git commit -m "Lock file for main"
          git push
