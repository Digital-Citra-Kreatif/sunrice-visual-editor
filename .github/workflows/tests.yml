name: tests

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, sqlite3, pdo_sqlite, gd, intl
          coverage: none

      - name: Install dependencies
        run: .github/run.sh install composer install --no-interaction --prefer-dist --no-ansi
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

      - name: Lint
        run: .github/run.sh lint composer lint

      - name: Analyse
        run: .github/run.sh analyse composer analyse -- --no-progress --no-ansi

      - name: Test
        run: .github/run.sh test composer test -- --colors=never

      - name: Round-trip test
        run: .github/run.sh spike composer spike

      # The workbench is the site developers run by hand: build it and ask
      # it for the homepage, so `testbench serve` is known to work.
      - name: Workbench site
        if: matrix.php == '8.4'
        run: .github/run.sh workbench .github/workbench-smoke.sh

      # Job logs can't always be read where this package is developed;
      # failures are repeated as annotations, which can.
      - name: Report failures
        if: failure()
        run: .github/run.sh --report
