name: tests

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    shell: bash

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']

    # Each check runs even when an earlier one failed, so one run reports everything.
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, sqlite3, pdo_sqlite, gd, intl
          coverage: none

      - name: Install dependencies
        run: .github/run.sh install composer install --no-interaction --prefer-dist --no-ansi
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

      - name: Lint
        if: ${{ !cancelled() }}
        run: .github/run.sh lint composer lint

      - name: Analyse
        if: ${{ !cancelled() }}
        run: .github/run.sh analyse composer analyse -- --no-progress --no-ansi

      - name: Test
        if: ${{ !cancelled() }}
        run: .github/run.sh test composer test -- --colors=never

      - name: Round-trip test
        if: ${{ !cancelled() }}
        run: .github/run.sh spike composer spike

      # The same for stylesheets; once with Bootstrap, Bulma, Pico and normalize.css too.
      - name: Fetch other people's stylesheets
        if: ${{ !cancelled() && matrix.php == '8.4' }}
        run: .github/run.sh css-fetch spike/css-fetch.sh
        env:
          SPIKE_DEPS: ${{ github.workspace }}/.ci/deps

      - name: 'Round-trip test: stylesheets'
        if: ${{ !cancelled() }}
        run: .github/run.sh spike-css composer spike:css
        env:
          SPIKE_DEPS: ${{ github.workspace }}/.ci/deps

      # The workbench is the site developers run by hand: build it and ask
      # it for the homepage, so `testbench serve` is known to work.
      - name: Workbench site
        if: ${{ !cancelled() && matrix.php == '8.4' }}
        run: .github/run.sh workbench .github/workbench-smoke.sh

      # Job logs can't always be read where this package is developed;
      # failures are repeated as annotations, which can.
      - name: Report failures
        if: failure()
        run: .github/run.sh --report

  # What docs/installation.md says, done on a new Laravel application with
  # Sunrice, and the site checked as installed: the page is tried, not only read.
  install:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Composer takes the package from this checkout as a git repository.
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, sqlite3, pdo_sqlite, gd, intl
          coverage: none

      - name: Install on a new site
        run: .github/run.sh install-check .github/install-check.sh
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

      - name: Report failures
        if: failure()
        run: .github/run.sh --report
