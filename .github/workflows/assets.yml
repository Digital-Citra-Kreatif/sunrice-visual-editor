name: assets

# Builds the editor's admin script, checks it in a browser against the
# workbench site, and commits what it built (dist/, the lock file, the
# screenshot) to the pull request's branch.

on:
  pull_request:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: assets-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    # Committing to the branch needs a branch of this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm packages
        run: .github/run.sh npm-install npm install --no-audit --no-fund

      - name: Typecheck
        run: .github/run.sh typecheck npm run typecheck

      - name: Frontend tests
        run: .github/run.sh frontend npm run test:frontend

      - name: Build
        run: .github/run.sh build npm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, sqlite3, pdo_sqlite, gd, intl
          coverage: none

      - name: Install Composer packages
        run: .github/run.sh composer-install composer install --no-interaction --prefer-dist --no-ansi
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

      - name: Editor in a browser
        run: .github/run.sh browser .github/workbench-smoke.sh npm run test:browser

      - name: Commit what was built
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist package-lock.json docs/screenshots
          if git diff --cached --quiet; then
              echo "Nothing new was built."
          else
              git commit -m "Build the admin script"
              git push
          fi

      - name: Report failures
        if: failure()
        run: .github/run.sh --report
