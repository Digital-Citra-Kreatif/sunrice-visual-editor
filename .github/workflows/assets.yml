name: assets

# Builds the editor's admin script, checks it in a browser against the
# workbench site, and commits what it built (dist/, the lock file, the
# screenshot) to the pull request's branch.

on:
  pull_request:

permissions:
  contents: write

defaults:
  run:
    shell: bash

concurrency:
  group: assets-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  assets:
    runs-on: ubuntu-latest
    # Committing to the branch needs a branch of this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm packages
        run: .github/run.sh npm-install npm install --no-audit --no-fund

      - name: Typecheck
        run: .github/run.sh typecheck npm run typecheck

      - name: Frontend tests
        run: .github/run.sh frontend npm run test:frontend

      - name: Build
        run: .github/run.sh build npm run build

      - name: Bridge script in a browser
        run: .github/run.sh bridge npm run test:bridge

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, sqlite3, pdo_sqlite, gd, intl
          coverage: none

      - name: Install Composer packages
        run: .github/run.sh composer-install composer install --no-interaction --prefer-dist --no-ansi
        env:
          COMPOSER_AUTH: '{"github-oauth": {"github.com": "${{ github.token }}"}}'

      - name: Editor in a browser
        run: .github/run.sh browser .github/workbench-smoke.sh npm run test:browser

      # What the stylesheet reader finds in the fixture stylesheets, and each
      # change it makes to them, put to the browser: does it read the same?
      - name: Stylesheets in a browser
        run: .github/run.sh css-browser npm run test:css

      - name: Commit what was built
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist package-lock.json
          # A fresh screenshot is never byte-identical to the last one: keep
          # it only when this pull request changes what the editor looks like.
          if [ -n "$(git diff --name-only "origin/${{ github.base_ref }}...HEAD" -- resources tests/Browser)" ] || ! git diff --cached --quiet -- dist; then
              git add docs/screenshots
          else
              git checkout -- docs/screenshots
          fi
          if git diff --cached --quiet; then
              echo "Nothing new was built."
          else
              git commit -m "Build the admin script"
              git push
          fi

      - name: Report failures
        if: failure()
        run: .github/run.sh --report
